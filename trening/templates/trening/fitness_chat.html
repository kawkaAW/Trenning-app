<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
        }
        .chat-container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f9f9f9;
            border-bottom: 1px solid #ddd;
        }
        .chat-box p {
            margin: 10px 0;
        }
        .user-message {
            text-align: right;
            color: blue;
        }
        .assistant-message {
            text-align: left;
            color: green;
        }
        .input-container {
            display: flex;
            padding: 10px;
        }
        .input-container input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .input-container button {
            margin-left: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .input-container button:hover {
            background-color: #0056b3;
        }
        .top-menu {
            background-color: #2c3e50;
            padding: 10px 20px;
            text-align: center;
        }

        .top-menu nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .top-menu nav ul li {
            margin: 0 15px;
        }

        .top-menu nav ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            transition: color 0.3s;
        }

        .top-menu nav ul li a:hover {
            color: #1abc9c;
        }
    </style>
    <script>
        async function sendMessage() {
            const messageInput = document.getElementById("userMessage");
            const chatBox = document.getElementById("chatBox");

            const userMessage = messageInput.value.trim();
            if (!userMessage) {
                alert("Wpisz wiadomość!");
                return;
            }

            chatBox.innerHTML += `<p class="user-message"><strong>Ty:</strong> ${userMessage}</p>`;
            messageInput.value = ""; 
            try {
                const response = await fetch("/fitness-chat/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message: userMessage }),
                });

                const data = await response.json();

                if (response.ok) {
                    chatBox.innerHTML += `<p class="assistant-message"><strong>Asystent:</strong> ${data.response}</p>`;
                } else {
                    chatBox.innerHTML += `<p class="assistant-message"><strong>Błąd:</strong> ${data.error}</p>`;
                }

                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                chatBox.innerHTML += `<p class="assistant-message"><strong>Błąd:</strong> Wystąpił problem z serwerem.</p>`;
            }
        }
    </script>
</head>
<body>
    <div class="top-menu">
        <nav>
            <ul>
                <li><a href="{% url 'trening:dashboard' %}">Główny Panel</a></li>
                <li><a href="{% url 'trening:training_plan' %}">Plan Treningowy</a></li>
                <li><a href="{% url 'trening:data_analysis' %}">Analiza Danych</a></li>
                <li><a href="{% url 'trening:chat' %}">Chat Fitness</a></li>
                <li><a href="{% url 'trening:goals_and_rewards' %}">Cele i Nagrody</a></li>
                <li><a href="{% url 'trening:user_data' %}">Dane Użytkownika</a></li>
                <li><a href="{% url 'trening:logout' %}">Wyloguj</a></li>
            </ul>
        </nav>
    </div>
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <p class="assistant-message"><strong>Asystent:</strong> Cześć! Jak mogę Ci pomóc?</p>
        </div>
        <div class="input-container">
            <input type="text" id="userMessage" placeholder="Wpisz wiadomość..." />
            <button onclick="sendMessage()">Wyślij</button>
        </div>
    </div>
</body>
</html>
