<form id="workout-form" method="POST" action="{% url 'generate_plan' %}">
    {% csrf_token %}
    <label>Wiek:</label>
    <input type="number" name="age" required>
    
    <label>Płeć:</label>
    <select name="gender">
      <option value="Male">Mężczyzna</option>
      <option value="Female">Kobieta</option>
    </select>
    
    <label>Waga (kg):</label>
    <input type="number" name="weight" step="0.1" required>
    
    <label>Wzrost (m):</label>
    <input type="number" name="height" step="0.01" required>
    
    <label>Maksymalne tętno:</label>
    <input type="number" name="max_bpm" required>
    
    <label>Średnie tętno:</label>
    <input type="number" name="avg_bpm" required>
    
    <label>Spoczynkowe tętno:</label>
    <input type="number" name="resting_bpm" required>
    
    <label>Procent tłuszczu:</label>
    <input type="number" name="fat_percentage" step="0.1" required>
    
    <label>Spożycie wody (litry):</label>
    <input type="number" name="water_intake" step="0.1" required>
    
    <label>Poziom doświadczenia (1-3):</label>
    <input type="number" name="experience_level" min="1" max="3" required>
    
    <label>BMI:</label>
    <input type="number" name="bmi" step="0.1" required>
    
    <button type="submit">Generuj Plan</button>
  </form>
