services:
  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput && \
             gunicorn treningapp.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - staticfiles:/Aplikacja/staticfiles
    expose:
      - '8000'
    environment:
      - PYTHONUNBUFFERED=1
      - DJANGO_SETTINGS_MODULE=treningapp.settings
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-unsafe-dev-secret-key-change-me}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}

  nginx:
    image: nginx:stable-alpine
    depends_on:
      - web
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/usr/share/nginx/html/static:ro

volumes:
  staticfiles:
